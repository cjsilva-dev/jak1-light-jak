name: "Bug report"
description: Something wrong with Light Jak? Tell me here.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! The more of this you fill in, the faster I can fix it.
  - type: input
    id: version
    attributes:
      label: Mod version
      description: Shown next to Light Jak in the OpenGOAL launcher's Mods list.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: What are you playing on?
      options:
        - Steam Deck
        - Linux (other)
        - Windows
        - Mac
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Was Jak flying?
      options:
        - Flying or gliding
        - Landing (superhero landing or normal)
        - On the ground as Light Jak
        - Switching Light Jak on or off (R3)
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead? Screenshots or a video clip help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How do I make it happen?
      description: Where you were in the game and what you pressed, step by step.
      placeholder: |
        1. Went to ...
        2. Flew up and pressed ...
        3. ...
  - type: dropdown
    id: repeat
    attributes:
      label: Does it happen every time?
      options:
        - "Yes, every time"
        - Sometimes
        - Only happened once
  - type: textarea
    id: log
    attributes:
      label: Game log (especially for crashes)
      description: |
        Drag the newest log file in here. It's in your OpenGOAL install folder (the one you picked in the launcher):
        `features/jak1/mods/Dark Flight & True Flight/light-jak/data/log/`
        If the mod failed to install or build, the launcher's own logs help instead: Linux/Steam Deck `~/.local/share/OpenGOAL-Launcher/logs`, Windows `%APPDATA%\OpenGOAL-Launcher\logs`.
